<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notpad</title>
    <style>
        *{
            box-sizing: border-box;
        }
        body{
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            direction: rtl;
        }


        .app{
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #0002;
        }

        h1{
            text-align: center;
            color: blue;
        }

        input{
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        textarea{
            width: 100%;
            height: 350px;
            padding: 15px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
            outline: none;
        }

        textarea:facus{
            border-color: #2563eb;
        }

        .button{
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        button{
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        .save{
            background: #2563eb;
        }
        .clear{
            background: #ef4444;
        }

        .count{
            margin-top: 15px;
            color: #666;
        }
    </style>

</head>
<body>
    <div class="app">
    <h1>Notpad</h1>

    <input
    tupe="text"
    id="filname"
    placeholder="ecrer nom de ficher..."
    value="my-note">

    <textarea
    id="note"
    placeholder="ecreer ici...">
</textarea>

<div calss="butons">
    <button class="save" onclick="saveNote()">💾 حفظ النص</button>

    <button class="clear" onclick="clearNote()">💾 del</button>>
    </div>

    <p class="count">
           عدد الحروف: <span id="counter">0</span>


    </p>
    </div>

    <script>
        const note = document.getElementById("note");
        const counter = document.getElementById("counter");

        note.addEventListener("input", function () {
            counter.textContent= note.value.length;
        });

        function saveNote() {
            const filname = 
              document.getElementById("filname").value || "my-note";

              const blob = new Blob(
                 [note.value],
                 { type: "text/plain;charset=utf-8"}
              );

              const link = document.createElement("a");

              link.href = URL.createObjectURL(blob);
              link.download = filname + ".txt";

              link.click();

              URL.revokeObjectURL(link.href);
        }

        function clearNote() {
            if (confirm("vous poux delete?")) {
                note.value = "";
                counter.textContent = "0";

            }
        }









    </script>


    
</body>
</html>
